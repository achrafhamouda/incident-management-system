server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: incident-service
          uri: lb://incident-service
          predicates:
            - Path=/incidents/**
          filters:
            - TokenRelay=

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/SGI-realm
          # LIGNE CRUCIALE : On donne l'adresse directe des clés pour éviter le blocage
          jwk-set-uri: http://localhost:8180/realms/SGI-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka