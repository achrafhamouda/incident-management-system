spring.application.name=incident-service
server.port=8082

# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5432/incidents_db
spring.datasource.username=postgres
spring.datasource.password=sofyan2004
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka & Config Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.config.import=optional:configserver:http://localhost:8888

# --- CONFIGURATION SÉCURITÉ KEYCLOAK ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/SGI-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/SGI-realm/protocol/openid-connect/certs